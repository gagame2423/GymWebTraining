  function loadState() {
    const base=DEFAULT_STATE();
    try {
      const raw=localStorage.getItem(STORAGE_KEY) || localStorage.getItem('repquest_fitness_save_v1');
      if (!raw) return base;
      const parsed=JSON.parse(raw); if (!parsed || typeof parsed !== 'object') return base;
      const profile={...base.profile,...(parsed.profile||{})};
      profile.badges=Array.isArray(profile.badges)?profile.badges:[];
      profile.personalRecords=profile.personalRecords&&typeof profile.personalRecords==='object'?profile.personalRecords:{};

      profile.bodyWeightKg=Math.max(25,Math.min(300,Number(profile.bodyWeightKg)||70));
      const savedRoutine=parsed.routine||{};
      // Keep user-created routines/schedule while seeding missing preset definitions.
      const sessions={...base.routine.sessions,...(savedRoutine.sessions||{})};
      for (const [id, session] of Object.entries(sessions)) {
        if (!session || typeof session!=='object') { delete sessions[id]; continue; }
        session.id=id; session.name=String(session.name||id); session.icon=session.icon||'🏋️'; session.exercises=Array.isArray(session.exercises)?session.exercises.filter(Boolean):[];

      }
      if (!sessions.rest) sessions.rest=base.routine.sessions.rest;
      let schedule={...base.routine.schedule,...(savedRoutine.schedule||{})};
      for(let day=0;day<7;day++) if(!sessions[schedule[day]]) schedule[day]='rest';
      const history=Array.isArray(parsed.history)?parsed.history:[];
      let activeSession=parsed.activeSession&&Array.isArray(parsed.activeSession.exercises)&&parsed.activeSession.date?parsed.activeSession:null;

      return {...base,...parsed,version:2,profile,settings:{...base.settings,...(parsed.settings||{})},routine:{sessions,schedule},history,activeSession};

  function localDateKey(date){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;}

      <article class="panel routine-detail"><div class="panel-heading"><div><div class="panel-title">Bộ bài tập</div><div class="panel-caption">Set, reps, tạ mục tiêu và cardio</div></div><span class="pill pill-green">${session.exercises.length} bài</span></div><div class="session-list">${options.map(s=>`<button class="session-chip ${s.id===selectedRoutineSession?'selected':''}" data-action="select-session" data-session-id="${safeText(s.id)}">${safeText(s.icon||'🏋️')} ${safeText(s.name)}</button>`).join('')}</div>${session.id==='rest'?`<div class="empty-state"><div class="empty-icon">🌿</div><h3>Ngày xả cơ</h3><p>Không cần set nào cả. Chọn một buổi khác để chỉnh bài tập, hoặc gán Cardio vào lịch nếu muốn vận động nhẹ.</p></div>`:`<div class="exercise-list">${session.exercises.map((ex,i)=>renderRoutineExercise(ex,i)).join('')||`<div class="empty-state"><div class="empty-icon">🏋️</div><h3>Chưa có bài nào</h3><p>Thêm bài ở phần dưới để setup buổi tập.</p></div>`}</div>
      <form class="routine-form" id="custom-exercise-form"><div class="form-title">＋ Thêm bài tập vào ${safeText(session.name)}</div><div class="form-grid"><div class="field span-2"><label for="library-select">Chọn bài có sẵn</label><select id="library-select">${EXERCISE_LIBRARY.map((ex,i)=>`<option value="${i}">${ex.type==='cardio'?'🏃 Cardio · ':''}${safeText(ex.name)}${ex.failure?' · To Failure':''}</option>`).join('')}</select></div><div class="field"><label for="library-sets">Số sets (strength)</label><input id="library-sets" type="number" min="1" max="12" value="3" inputmode="numeric"></div><div class="field"><label for="library-reps">Reps mục tiêu</label><input id="library-reps" type="number" min="1" max="100" value="8" inputmode="numeric"></div><div class="field span-2"><button class="btn btn-primary btn-full" type="button" data-action="add-library-exercise">＋ Thêm bài đã chọn</button></div><div class="field span-2"><div class="divider"></div><label for="custom-ex-name">Hoặc tự tạo bài mới (tên bài giữ English nếu là tên bài tập)</label><input id="custom-ex-name" type="text" maxlength="80" placeholder="Ví dụ: Cable fly / Easy cycling"></div><div class="field"><label for="custom-ex-muscle">Nhóm cơ / ghi chú</label><input id="custom-ex-muscle" type="text" maxlength="80" placeholder="Ngực, cardio..."></div><div class="field"><label for="custom-ex-type">Loại bài</label><select id="custom-ex-type"><option value="strength">Strength / Ghi tạ</option><option value="cardio">Cardio</option></select></div><div class="field"><label for="custom-ex-sets">Sets</label><input id="custom-ex-sets" type="number" min="1" max="12" value="3" inputmode="numeric"></div><div class="field"><label for="custom-ex-reps">Reps</label><input id="custom-ex-reps" type="number" min="1" max="100" value="10" inputmode="numeric"></div><div class="field"><label for="custom-ex-weight">Tạ mục tiêu (${unit()})</label><input id="custom-ex-weight" type="number" min="0" step="0.5" value="0" inputmode="decimal"></div><div class="field"><label for="custom-ex-rest">Nghỉ (giây)</label><input id="custom-ex-rest" type="number" min="0" max="600" value="60" inputmode="numeric"></div><div class="field span-2"><button class="btn btn-cyan btn-full" type="submit">Tạo bài tập tùy chỉnh</button></div></div><div class="form-note">Cardio có trường đo riêng: Jump Rope (số lần hoặc phút), treadmill (incline/km/phút), cycling (resistance/km/phút).</div></form>`}</article></div></section>`;
  }
  function renderRoutineExercise(ex,index){

  function startWorkout(sessionId){
    if(state.activeSession){navigate('workout');showToast('Bạn đang có buổi tập dang dở. Vào tiếp nhé!','⚡');return;}
    const now=new Date(),date=localDateKey(now),sid=sessionId||currentSessionId(now),template=sessionById(sid);
    if(!template||sid==='rest'){showToast('Chọn một buổi tập, hoặc thêm cardio cho ngày hôm nay nha.','🌿');return;}
    if(!template.exercises.length){showToast('Buổi này chưa có bài. Mở Lịch tập để thêm bài nhé.','🏋️');navigate('routine');return;}
    state.activeSession={id:uid(),date,sessionId:sid,split:template.name,icon:template.icon||'💪',startedAt:Date.now(),startedAtLabel:now.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}),unit:unit(),restTimerEnd:null,exercises:template.exercises.map(ex=>{
      if(ex.type==='cardio') return {id:ex.id,name:ex.name,muscle:ex.muscle,icon:ex.icon,type:'cardio',cardioType:ex.cardioType||'jump_rope',restSec:ex.rest||30,rating:null,cardio:defaultCardio(ex.cardioType)};
      return {id:ex.id,name:ex.name,muscle:ex.muscle,icon:ex.icon,type:'strength',failure:!!ex.failure,repRange:ex.repRange||`${Math.max(1,(Number(ex.reps)||8)-2)}–${(Number(ex.reps)||8)+2}`,targetReps:Number(ex.reps)||8,targetWeight:Number(ex.targetWeight)||0,restSec:Number(ex.rest)||60,unit:unit(),rating:null,sets:Array.from({length:Math.max(1,Math.min(12,Number(ex.sets)||3))},()=>({reps:Number(ex.reps)||8,weightKg:Number(ex.targetWeight)||0,completed:false}))};
    })};
    saveState();navigate('workout');showToast(`Vào buổi ${template.name} thôi! Cày có tâm nha.`,'💪');
  }
  function renderWorkout(){
    const active=state.activeSession;
    if(!active){
      const options=Object.values(state.routine.sessions).filter(s=>s.id!=='rest');
      return `<section class="screen"><div class="heading-row"><div><div class="eyebrow">CHẾ ĐỘ TẬP LUYỆN</div><h1 class="page-heading">Ghi tạ & cardio</h1><p class="page-subtitle">Chọn buổi để bắt đầu log. Dữ liệu sẽ tự lưu vào trình duyệt.</p></div></div><article class="panel routine-detail"><div class="panel-heading"><div><div class="panel-title">Chọn buổi tập</div><div class="panel-caption">Strength, cardio hoặc kết hợp cả hai</div></div><span>💪</span></div><div class="form-grid"><div class="field span-2"><label for="workout-session-select">Buổi muốn tập</label><select id="workout-session-select">${options.map(s=>`<option value="${safeText(s.id)}" ${s.id===currentSessionId()?'selected':''}>${safeText(s.name)}</option>`).join('')}</select></div><div class="field span-2"><button class="btn btn-primary btn-full" data-action="start-selected">Bắt đầu buổi tập →</button></div><div class="field span-2"><button class="btn btn-quiet btn-full" data-action="go-routine">⚙️ Chỉnh lịch / bài tập</button></div></div></article></section>`;
    }
    const completed=sessionCompletedSets(active),total=sessionTotalSets(active),volume=sumSessionVolume(active),elapsed=Math.max(1,Math.round((Date.now()-active.startedAt)/60000));
    return `<section class="screen"><div class="heading-row"><div><div class="eyebrow">ĐANG VÀO SET · ${safeText(active.date)}</div><h1 class="page-heading">${safeText(active.split)}</h1><p class="page-subtitle">Tập trung form, kiểm soát rep — đừng ego lift nhé.</p></div><div class="heading-actions"><button class="btn btn-danger" data-action="cancel-workout">Thoát buổi</button></div></div>
      <div class="workout-sticky panel"><div class="workout-sticky-top"><div><span class="pill pill-cyan">⏱ <span id="timer-label">Đang nghỉ?</span></span><div class="workout-clock" id="rest-countdown">00:00</div><div class="small-text" id="timer-subtitle">Bắt đầu nghỉ sau set.</div></div><div class="workout-stats-live"><div><small>Set đã xong</small><strong id="summary-sets">${completed} / ${total}</strong></div><div><small>Volume</small><strong id="summary-volume">${formatNumber(volume)} kg</strong></div><div><small>Thời gian</small><strong>${elapsed} phút</strong></div></div></div><div class="workout-sticky-actions"><button class="btn btn-cyan btn-sm" data-action="start-rest-manual" data-seconds="60">⏱ Nghỉ 60s</button><button class="btn btn-quiet btn-sm" data-action="start-rest-manual" data-seconds="90">Nghỉ 90s</button><button class="btn btn-quiet btn-sm" data-action="skip-rest">Bỏ nghỉ</button></div></div>
      <div class="workout-columns"><div class="workout-main"><div class="workout-exercise-stack">${active.exercises.map((ex,i)=>renderWorkoutExercise(ex,i)).join('')}</div></div><aside class="workout-side"><article class="panel timer-panel"><div class="timer-emoji">⏱️</div><div class="panel-title">Đồng hồ nghỉ</div><div class="timer-big" id="rest-countdown-side">00:00</div><p class="small-text" id="timer-side-subtitle">Hồi sức để set tiếp theo chất lượng hơn.</p><div class="timer-quick"><button class="btn btn-cyan btn-sm" data-action="start-rest-manual" data-seconds="60">60s</button><button class="btn btn-quiet btn-sm" data-action="start-rest-manual" data-seconds="90">90s</button><button class="btn btn-quiet btn-sm" data-action="start-rest-manual" data-seconds="120">120s</button></div></article><article class="panel finish-box"><div class="finish-icon">🏆</div><h3>Chốt kèo nhận EXP</h3><p id="finish-note">Hoàn thành tất cả set/cardio và chấm điểm cảm nhận cơ để nhận thưởng.</p><div class="finish-summary"><div><span>Set / hoạt động</span><strong>${completed}/${total}</strong></div><div><span>Volume tạ</span><strong>${formatNumber(volume)} kg</strong></div></div><button class="btn btn-primary btn-full" id="finish-workout-btn" data-action="finish-workout" ${sessionIsReadyToFinish(active)?'':'disabled'}>Hoàn thành buổi tập & Nhận EXP 🏆</button><div class="small-text" style="margin-top:10px">+100 EXP · +25 Gems · Ước tính kcal</div></article></aside></div></section>`;
  }
  function renderWorkoutExercise(ex,index){
    if(ex.type==='cardio') return renderCardioExercise(ex,index);
    const done=ex.sets.filter(s=>s.completed).length;
    return `<article class="panel workout-exercise"><div class="work-exercise-head"><div class="exercise-icon">${safeText(ex.icon||'🏋️')}</div><div><h3>${safeText(ex.name)}</h3><p>${safeText(ex.muscle||'Toàn thân')} · ${done}/${ex.sets.length} sets xong ${ex.failure?'<span class="pill pill-gold">TO FAILURE</span>':''}</p></div><div class="work-target"><strong>${ex.sets.length} × ${safeText(ex.repRange||`${Math.max(1,(Number(ex.targetReps)||8)-2)}–${(Number(ex.targetReps)||8)+2}`)}</strong>Reps mục tiêu</div></div><div class="sets-header"><span>SET</span><span class="right">REPS</span><span class="right">TẠ (${safeText(ex.unit||unit())})</span><span class="right">DONE</span></div>${ex.sets.map((s,j)=>`<div class="set-row"><div class="set-num">${String(j+1).padStart(2,'0')}</div><input aria-label="${safeText(ex.name)} set ${j+1} reps" type="number" min="0" max="1000" step="1" value="${Number(s.reps)||0}" data-set-input="reps" data-ex-index="${index}" data-set-index="${j}" inputmode="numeric"><input aria-label="${safeText(ex.name)} set ${j+1} weight" type="number" min="0" max="5000" step="0.5" value="${kgToDisplay(Number(s.weightKg)||0,ex.unit||unit()).toFixed(1).replace(/\.0$/,'')}" data-set-input="weight" data-ex-index="${index}" data-set-index="${j}" inputmode="decimal"><button class="set-check ${s.completed?'checked':''}" data-action="toggle-set" data-ex-index="${index}" data-set-index="${j}" aria-label="${s.completed?'Bỏ đánh dấu':'Hoàn thành'} set ${j+1}">${s.completed?'✓':'○'}</button></div>`).join('')}<div class="exercise-rating"><div class="rating-copy"><strong>Độ cảm nhận cơ (Mind-Muscle Connection)</strong><small>${ex.rating?`Đã chấm ${ex.rating}/5 · +${ex.rating*10}% EXP bonus`:'Bạn cảm nhận cơ mục tiêu tốt tới đâu?'}</small></div><div class="stars" role="group" aria-label="Chấm điểm form từ 1 đến 5 sao">${[1,2,3,4,5].map(n=>`<button class="star-btn ${ex.rating>=n?'selected':''}" data-action="rating" data-ex-index="${index}" data-rating="${n}" aria-label="${n} trên 5 sao">★</button>`).join('')}</div></div><div class="cardio-inline-actions"><button class="btn btn-cyan btn-sm" data-action="start-rest-manual" data-seconds="${Number(ex.restSec)||60}">⏱ Nghỉ ${Number(ex.restSec)||60}s</button></div></article>`;
  }
  function renderCardioExercise(ex,index){
    const c=ex.cardio||defaultCardio(ex.cardioType);
    let fields='';
    if(ex.cardioType==='jump_rope') fields=`<div class="cardio-mode"><label><input type="radio" name="jump-mode-${index}" value="counts" data-cardio-mode="counts" data-ex-index="${index}" ${c.mode==='counts'?'checked':''}> Đếm số cái</label><label><input type="radio" name="jump-mode-${index}" value="duration" data-cardio-mode="duration" data-ex-index="${index}" ${c.mode!=='counts'?'checked':''}> Theo thời gian</label></div><div class="cardio-fields">${c.mode==='counts'?`<label>Số cái nhảy<input type="number" min="0" step="10" inputmode="numeric" data-cardio-field="counts" data-ex-index="${index}" value="${Number(c.counts)||0}"></label>`:''}<label>Thời gian (phút)<input type="number" min="0" max="600" step="1" inputmode="decimal" data-cardio-field="duration" data-ex-index="${index}" value="${Number(c.duration)||0}"></label></div><p class="form-note">Ước tính khoảng 10–12 kcal/phút. Nếu log theo số cái, thời gian quy đổi để tính kcal sẽ xấp xỉ 100 cái/phút.</p>`;

  function renderLineChart(items,aria){
    const width=540,height=210,left=42,right=12,top=12,bottom=28,plotW=width-left-right,plotH=height-top-bottom;
    if(!items.length)return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${safeText(aria)}"><text x="${width/2}" y="${height/2}" class="chart-label" text-anchor="middle">Tập vài buổi để có biểu đồ nha</text></svg>`;
    const data=items.slice(-10),max=Math.max(1,...data.map(x=>Number(x.value)||0))*1.15,x=i=>left+(data.length===1?plotW/2:i/(data.length-1)*plotW),y=v=>top+plotH-(Number(v||0)/max)*plotH;
    let grid='';for(let i=0;i<4;i++){const yy=top+i*plotH/3;grid+=`<line class="chart-gridline" x1="${left}" x2="${width-right}" y1="${yy}" y2="${yy}"/><text class="chart-label" x="${left-7}" y="${yy+3}" text-anchor="end">${formatNumber(max*(1-i/3))}</text>`;}
    const points=data.map((d,i)=>`${x(i)},${y(d.value)}`).join(' '),area=`${x(0)},${top+plotH} ${points} ${x(data.length-1)},${top+plotH}`;
    return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${safeText(aria)}">${grid}<polygon points="${area}" fill="rgba(34,197,94,.10)"/><polyline points="${points}" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${data.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d.value)}" r="3.5" fill="#0f172a" stroke="#86efac" stroke-width="2"><title>${safeText(d.label)}: ${formatNumber(d.value,1)}</title></circle>`).join('')}${data.map((d,i)=>(data.length<=5||i%Math.ceil(data.length/5)===0||i===data.length-1)?`<text class="chart-label" x="${x(i)}" y="${height-7}" text-anchor="middle">${safeText(d.label)}</text>`:'').join('')}</svg>`;
  }

  function updateWorkoutSummary(){const active=state.activeSession;if(!active)return;const done=sessionCompletedSets(active),total=sessionTotalSets(active),vol=sumSessionVolume(active);const sets=document.getElementById('summary-sets'),volume=document.getElementById('summary-volume'),finish=document.getElementById('finish-workout-btn'),note=document.getElementById('finish-note');if(sets)sets.textContent=`${done} / ${total}`;if(volume)volume.textContent=`${formatNumber(vol)} kg`;if(finish)finish.disabled=!sessionIsReadyToFinish(active);if(note)note.textContent=sessionIsReadyToFinish(active)?'Đủ điều kiện rồi. Chốt buổi để nhận EXP & Gems!':'Hoàn thành tất cả set/hoạt động và chấm điểm cảm nhận cơ để mở khóa phần thưởng.';}
  function updateSetInput(input){const ex=state.activeSession?.exercises?.[Number(input.dataset.exIndex)],set=ex?.sets?.[Number(input.dataset.setIndex)];if(!set)return;const value=Math.max(0,Number(input.value)||0);if(input.dataset.setInput==='reps')set.reps=Math.min(1000,Math.round(value));if(input.dataset.setInput==='weight')set.weightKg=displayToKg(value,ex.unit||unit());saveState();const volume=document.getElementById('summary-volume');if(volume)volume.textContent=`${formatNumber(sumSessionVolume(state.activeSession))} kg`;}

  function formatTimer(total){const secs=Math.max(0,Math.ceil(total));return `${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;}
  function startRestTimer(seconds,toast=true){if(!state.activeSession)return;state.activeSession.restTimerEnd=Date.now()+Math.max(0,Number(seconds)||0)*1000;saveState();updateRestTimer();if(toast)showToast(`Bắt đầu nghỉ · ${formatTimer(seconds)}`,'⏱');}

  function updateRestTimer(){const session=state.activeSession,display=document.getElementById('rest-countdown'),display2=document.getElementById('rest-countdown-side');if(!session?.restTimerEnd){if(display)display.textContent='00:00';if(display2)display2.textContent='00:00';const label=document.getElementById('timer-label');if(label)label.textContent='Sẵn sàng';const subtitle=document.getElementById('timer-subtitle');if(subtitle)subtitle.textContent='Bắt đầu nghỉ sau khi xong set.';const sub2=document.getElementById('timer-side-subtitle');if(sub2)sub2.textContent='Hồi sức để set tiếp theo chất lượng hơn.';return;}const remain=Math.max(0,Math.ceil((session.restTimerEnd-Date.now())/1000));if(display)display.textContent=formatTimer(remain);if(display2)display2.textContent=formatTimer(remain);const label=document.getElementById('timer-label');if(label)label.textContent=remain?'Đang nghỉ':'Hết giờ nghỉ';const subtitle=document.getElementById('timer-subtitle');if(subtitle)subtitle.textContent=remain?'Hít thở sâu, chuẩn bị set kế.':'Triển set tiếp thôi!';const sub2=document.getElementById('timer-side-subtitle');if(sub2)sub2.textContent=remain?'Hồi sức, thả lỏng cơ.':'Đã đến giờ chiến tiếp!';if(remain===0){session.restTimerEnd=null;saveState();playBeep(true);showToast('Hết giờ nghỉ. Vào set tiếp nhé!','🔔');}}
  function playBeep(long=false){try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;const ctx=new Ctx(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.type='sine';osc.frequency.value=long?880:620;gain.gain.setValueAtTime(.0001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.12,ctx.currentTime+.02);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+(long?.35:.12));osc.start();osc.stop(ctx.currentTime+(long?.4:.15));osc.onended=()=>ctx.close();}catch(error){/* Audio optional; visual timer still works. */}}
  function cardioDuration(ex){const c=ex.cardio||{};return ex.cardioType==='jump_rope'&&c.mode==='counts'?Math.max(0,(Number(c.counts)||0)/100):Math.max(0,Number(c.duration)||0);}
  function estimateCardioKcal(ex,bodyWeight){const c=ex.cardio||{},mins=cardioDuration(ex);if(mins<=0)return 0;if(ex.cardioType==='jump_rope')return mins*11;
    if(ex.cardioType==='treadmill'){const distance=Math.max(0,Number(c.distance)||0),speed=distance/(mins/60||1),incline=Math.max(0,Number(c.incline)||0),met=c.mode==='walk'?3.5+Math.max(0,speed-3)*.8:7+Math.max(0,speed-6)*1.2;const base=met*3.5*bodyWeight/200*mins;return base*Math.min(2.6,Math.pow(1.1,Math.min(incline,10)));}
    const distance=Math.max(0,Number(c.distance)||0),speed=distance/(mins/60||1),resistance=Math.max(0,Number(c.resistance)||0),met=3.5+resistance*.65+Math.max(0,speed-12)*.3;return met*3.5*bodyWeight/200*mins;
  }
  function estimateSessionCalories(session,minutes){const bodyWeight=Number(state.profile.bodyWeightKg)||70,cardioExs=session.exercises.filter(ex=>ex.type==='cardio'&&ex.cardio?.completed),cardioMinutes=cardioExs.reduce((s,ex)=>s+cardioDuration(ex),0),cardioKcal=cardioExs.reduce((s,ex)=>s+estimateCardioKcal(ex,bodyWeight),0),hasStrength=session.exercises.some(ex=>ex.type!=='cardio');const volume=sumSessionVolume(session),sets=sessionCompletedSets(session);let strengthKcal=0;if(hasStrength){const strengthMinutes=Math.max(cardioMinutes>0?0:1,minutes-cardioMinutes);const intensity=1+Math.min(1.5,(sets/20)+(volume/10000));strengthKcal=bodyWeight*.07*Math.max(1,strengthMinutes)*intensity;}return Math.max(0,Math.round(cardioKcal+strengthKcal));}
  function cardioXp(ex){const c=ex.cardio||{},mins=cardioDuration(ex),distance=Math.max(0,Number(c.distance)||0),counts=c.mode==='counts'?Math.max(0,Number(c.counts)||0):0;return mins*4+distance*30+(ex.cardioType==='jump_rope'?counts/100*5:0);}
  function awardBadge(id){if(!state.profile.badges.includes(id)){state.profile.badges.push(id);const badge=ACHIEVEMENTS.find(item=>item.id===id);showToast(`Mở khóa huy hiệu: ${badge?.name||id}!`,'🏅');return true;}return false;}
  function checkAndAwardProgress(prs,now){if(state.history.length===1)awardBadge('first-workout');if(prs.length)awardBadge('pr-buster');if(now.getHours()<7)awardBadge('early-bird');if(now.getHours()>=22)awardBadge('night-owl');if(state.profile.streak>=7&&awardBadge('iron-7'))state.profile.freezes++;if(state.profile.streak>=30&&awardBadge('iron-30'))state.profile.freezes++;if(state.profile.allTimeVolume>=10000)awardBadge('volume-10k');if(currentLevel().level>=10)awardBadge('level-10');if(state.profile.freezes>0)awardBadge('freeze-saver');}
  function countMissedScheduledDays(lastDate,todayDate){if(!lastDate||lastDate>=todayDate)return 0;let missed=0;for(let key=offsetDateKey(lastDate,1);key<todayDate;key=offsetDateKey(key,1)){const day=parseDateKey(key).getDay();if((state.routine.schedule[day]||'rest')!=='rest'&&!completedWorkoutOn(key))missed++;}return missed;}
  function finishWorkout(){
    const session=state.activeSession;if(!session)return;if(!sessionIsReadyToFinish(session)){showToast('Chưa xong đâu Gym Rat — hoàn thành từng set/hoạt động và chấm sao nhé.','🎯');return;}
    const now=new Date();let baseExp=0,mindBonus=0,volume=0,completedSets=0,prs=[];const histExercises=[];
    for(const ex of session.exercises){let exBase=0,exVol=0,maxWeight=0;
      if(ex.type==='cardio'){if(!ex.cardio?.completed)continue;const kcal=estimateCardioKcal(ex,Number(state.profile.bodyWeightKg)||70),base=cardioXp(ex);baseExp+=base;const bonus=base*(Number(ex.rating)||0)*.1;mindBonus+=bonus;completedSets++;histExercises.push({id:ex.id,name:ex.name,type:'cardio',cardioType:ex.cardioType,cardio:clone(ex.cardio),rating:ex.rating,caloriesKcal:Math.round(kcal),volume:0,sets:[]});continue;}
      const sets=ex.sets.map(s=>{const reps=Math.max(0,Number(s.reps)||0),weightKg=Math.max(0,Number(s.weightKg)||0);if(s.completed){const v=weightKg*reps;exVol+=v;volume+=v;completedSets++;exBase+=v*.1;maxWeight=Math.max(maxWeight,weightKg);}return {reps,weightKg,completed:!!s.completed};});baseExp+=exBase;const bonus=exBase*(Number(ex.rating)||0)*.1;mindBonus+=bonus;const recordKey=String(ex.name||'').trim().toLowerCase(),prev=Number(state.profile.personalRecords[recordKey]||0);if(maxWeight>prev){state.profile.personalRecords[recordKey]=maxWeight;if(maxWeight>0)prs.push({name:ex.name,weightKg:maxWeight,previousKg:prev});}histExercises.push({id:ex.id,name:ex.name,type:'strength',sets,rating:ex.rating,volume:exVol});
    }
    const durationMinutes=Math.max(1,Math.round((now.getTime()-(session.startedAt||now.getTime()))/60000)),caloriesKcal=estimateSessionCalories(session,durationMinutes),baseTotal=Math.round(baseExp),bonusTotal=Math.round(mindBonus),rawXp=Math.round(baseExp+mindBonus+100),beforeLevel=currentLevel().level;
    state.profile.totalXp+=rawXp;state.profile.gems+=25;state.profile.allTimeVolume+=volume;
    const previousDate=state.profile.lastWorkoutDate;let streak;if(!previousDate)streak=1;else if(previousDate===session.date)streak=state.profile.streak||1;else{const missed=countMissedScheduledDays(previousDate,session.date);if(missed===0)streak=(state.profile.streak||0)+1;else if(state.profile.freezes>=missed){state.profile.freezes-=missed;streak=(state.profile.streak||0)+1;showToast(`Đã dùng ${missed} băng bảo vệ chuỗi. Chuỗi vẫn sống!`,'🧊');}else{streak=1;showToast('Bạn lỡ ngày tập theo lịch, chuỗi bắt đầu lại từ đầu nha.','🔥');}}
    state.profile.streak=streak;state.profile.bestStreak=Math.max(state.profile.bestStreak||0,streak);state.profile.lastWorkoutDate=session.date;
    const historyEntry={id:session.id,date:session.date,split:session.split,volume:Math.round(volume*10)/10,baseVolumeExp:baseTotal,mindBonusExp:bonusTotal,completionBonus:100,xpEarned:rawXp,completedSets,totalSets:sessionTotalSets(session),durationMinutes,caloriesKcal,prs:prs.map(p=>p.name),exercises:histExercises,completedAt:now.toISOString(),ratings:session.exercises.map(ex=>({name:ex.name,rating:ex.rating}))};
    state.history.push(historyEntry);state.history.sort((a,b)=>a.date.localeCompare(b.date)||String(a.completedAt||'').localeCompare(String(b.completedAt||'')));state.activeSession=null;checkAndAwardProgress(prs,now);const afterLevel=currentLevel().level;saveState();confettiBurst();if(afterLevel>beforeLevel)showLevelUp(afterLevel,rawXp,volume,prs,caloriesKcal);else showCompletionModal(rawXp,volume,bonusTotal,prs,streak,caloriesKcal);navigate('dashboard');
  }
  function showCompletionModal(xp,volume,bonus,prs,streak,calories){const root=document.getElementById('modal-root');root.innerHTML=`<div class="modal-backdrop" data-action="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="complete-title"><div class="modal-icon">🏆</div><div class="eyebrow">NHIỆM VỤ HOÀN THÀNH</div><h2 id="complete-title">Quá cháy Gym Rat!</h2><p>Buổi tập đã lưu. EXP đã nhận. Giờ thả lỏng, uống nước và tự hào về mình nhé.</p><div class="reward-card"><div class="reward-chip">⚡ +${formatNumber(xp)} EXP</div><div class="reward-chip">💎 +25 Gems</div><div class="reward-chip">🔥 Chuỗi ${streak} ngày</div><div class="reward-chip calorie-chip">🔥 ${formatNumber(calories)} kcal ước tính</div></div><p style="font-size:11px">${formatNumber(volume)} kg volume · +${formatNumber(bonus)} EXP bonus cảm nhận cơ${prs.length?` · PR mới: ${safeText(prs.map(p=>p.name).join(', '))}`:''}</p><p class="small-text">Kcal là ước tính tham khảo, không phải phép đo y tế/chính xác tuyệt đối.</p><button class="btn btn-primary btn-full" data-action="close-modal">Tiếp tục cày →</button></div></div>`;}
  function showLevelUp(level,xp,volume,prs,calories){const root=document.getElementById('modal-root');root.innerHTML=`<div class="modal-backdrop" data-action="close-modal"><div class="modal levelup-modal" role="dialog" aria-modal="true" aria-labelledby="levelup-title"><div class="modal-icon">👑</div><div class="eyebrow" style="color:var(--gold)">LEVEL UP!</div><h2 id="levelup-title">Lên Level ${level} rồi!</h2><p>Bạn chính thức trở thành <strong style="color:var(--gold)">${safeText(levelTitle(level))}</strong>. Từng rep đều có giá trị.</p><div class="reward-card"><div class="reward-chip">⚡ +${formatNumber(xp)} EXP</div><div class="reward-chip">💎 +25 Gems</div><div class="reward-chip">📈 ${formatNumber(volume)} kg volume</div><div class="reward-chip calorie-chip">🔥 ${formatNumber(calories)} kcal</div></div><button class="btn btn-primary btn-full" data-action="close-modal">Nhận cấp mới →</button></div></div>`;}
  function confettiBurst(){const colors=['#22c55e','#06b6d4','#f59e0b','#a78bfa','#fb7185'];for(let i=0;i<42;i++){const el=document.createElement('i');el.className='confetti';el.style.left=(Math.random()*100)+'vw';el.style.background=colors[i%colors.length];el.style.animationDelay=(Math.random()*.55)+'s';el.style.transform=`rotate(${Math.random()*180}deg)`;el.style.width=(5+Math.random()*6)+'px';el.style.height=(8+Math.random()*8)+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),3300);}}

  function applyPreset(kind){if(kind==='ppl')state.routine.schedule=DEFAULT_SCHEDULE();else if(kind==='upperlower')state.routine.schedule={0:'rest',1:'upper',2:'lower',3:'rest',4:'upper',5:'lower',6:'rest'};else if(kind==='fullbody')state.routine.schedule={0:'rest',1:'full_body',2:'rest',3:'full_body',4:'rest',5:'full_body',6:'rest'};saveState();renderScreen();showToast('Đã cập nhật lịch tuần!','📅');}
  function addCustomSession(){const name=prompt('Đặt tên split mới (ví dụ: Arms & Shoulders):');if(!name||!name.trim())return;const clean=name.trim().slice(0,40),id=clean.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')+'_'+Date.now().toString(36).slice(-4);state.routine.sessions[id]={id,name:clean,icon:'🏋️',exercises:[]};selectedRoutineSession=id;saveState();renderScreen();showToast(`Đã tạo ${clean}. Thêm bài vào thôi!`,'✨');}
  function addExerciseToSelected(exercise){const session=state.routine.sessions[selectedRoutineSession];if(!session||session.id==='rest')return;session.exercises.push(exercise);saveState();renderScreen();showToast(`Đã thêm ${exercise.name} vào ${session.name}.`,'➕');}
  function removeExercise(index){const session=state.routine.sessions[selectedRoutineSession],ex=session?.exercises?.[index];if(!ex)return;if(!confirm(`Xóa ${ex.name} khỏi ${session.name}?`))return;session.exercises.splice(index,1);saveState();renderScreen();showToast('Đã xóa bài tập.','🗑️');}
  function editRoutineTarget(input){const session=state.routine.sessions[selectedRoutineSession],ex=session?.exercises?.[Number(input.dataset.exIndex)];if(!ex)return;const field=input.dataset.routineField,value=Number(input.value);if(!Number.isFinite(value)||value<0){showToast('Nhập thông số hợp lệ nhé.','⚠️');return;}if(field==='sets')ex.sets=Math.max(1,Math.min(12,Math.round(value)));if(field==='reps')ex.reps=Math.max(1,Math.min(100,Math.round(value)));if(field==='weight')ex.targetWeight=displayToKg(value,unit());saveState();}
  function buyFreeze(){if(state.profile.gems<150){showToast('Cần 150 Gems mới mua được băng nha.','💎');return;}state.profile.gems-=150;state.profile.freezes++;awardBadge('freeze-saver');saveState();renderScreen();showToast('Đã thêm 1 Băng bảo vệ chuỗi vào túi!','🧊');}
  function resetRoutine(){if(!confirm('Khôi phục preset 7 ngày mặc định và bộ bài tập chuẩn? Lịch sử, EXP và Gems vẫn được giữ.'))return;state.routine={sessions:defaultSessions(),schedule:DEFAULT_SCHEDULE()};selectedRoutineSession='push';saveState();renderScreen();showToast('Đã khôi phục lịch mặc định.','↻');}
  function resetData(){if(!confirm('Xóa toàn bộ dữ liệu RepQuest trên trình duyệt này? Lịch sử, EXP và lịch custom sẽ mất. Hãy xuất JSON trước nếu muốn sao lưu.'))return;state=DEFAULT_STATE();selectedRoutineSession='push';currentScreen='dashboard';saveState();renderScreen();showToast('Đã reset dữ liệu về ban đầu.','↻');}
  function exportData(){const payload={...state,exportedAt:new Date().toISOString(),app:'RepQuest'};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`repquest-save-${localDateKey(new Date())}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);showToast('Đã xuất file JSON dự phòng.','⬇️');}
  function importData(){const input=document.createElement('input');input.type='file';input.accept='application/json,.json';input.onchange=()=>{const file=input.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(String(reader.result));if(!parsed||!parsed.profile||!parsed.routine||!Array.isArray(parsed.history))throw new Error('File không giống bản lưu RepQuest.');if(!confirm('Nhập bản lưu này và thay thế dữ liệu đang có trên trình duyệt?'))return;localStorage.setItem(STORAGE_KEY,JSON.stringify(parsed));state=loadState();selectedRoutineSession=Object.keys(state.routine.sessions).find(id=>id!=='rest')||'push';saveState();renderScreen();showToast('Đã nhập dữ liệu thành công!','✅');}catch(error){alert(`Không thể nhập file: ${error.message}`);}};reader.readAsText(file);};input.click();}

  function bindScreenEvents(){
    document.querySelectorAll('[data-screen]').forEach(button=>button.onclick=()=>navigate(button.dataset.screen));
    const view=document.getElementById('view');if(!view)return;
    view.querySelectorAll('[data-action]').forEach(el=>{el.onclick=event=>{const action=el.dataset.action,idx=Number(el.dataset.exIndex),setIdx=Number(el.dataset.setIndex);switch(action){
      case'go-routine':navigate('routine');break;case'go-profile':navigate('profile');break;case'go-workout':navigate('workout');break;
      case'start-workout':startWorkout();break;case'resume-workout':navigate('workout');break;case'review-today':navigate('profile');break;
      case'start-optional':startWorkout(document.getElementById('optional-session')?.value);break;case'start-selected':startWorkout(document.getElementById('workout-session-select')?.value);break;
      case'finish-workout':finishWorkout();break;case'toggle-set':toggleSet(idx,setIdx,!state.activeSession?.exercises?.[idx]?.sets?.[setIdx]?.completed);break;case'rating':setRating(idx,Number(el.dataset.rating));break;
      case'cancel-workout':if(confirm('Thoát buổi tập? Dữ liệu đang log vẫn được lưu để bạn quay lại sau. Không nhận thưởng cho đến khi hoàn thành.')){state.activeSession=null;saveState();navigate('dashboard');showToast('Đã thoát buổi tập, chưa nhận thưởng.','ℹ️');}break;
      case'start-rest-manual':startRestTimer(Number(el.dataset.seconds)||60);break;case'skip-rest':stopRestTimer();showToast('Đã bỏ qua giờ nghỉ.','⏱');break;
      case'save-routine':saveState();showToast('Đã lưu lịch tập.','✅');break;case'apply-preset':applyPreset(document.getElementById('preset-select')?.value||'ppl');break;case'add-session':addCustomSession();break;case'reset-routine':resetRoutine();break;case'select-session':selectedRoutineSession=el.dataset.sessionId;renderScreen();break;
      case'add-library-exercise':{const item=EXERCISE_LIBRARY[Number(document.getElementById('library-select')?.value)];if(!item)return;const sets=Math.max(1,Math.min(12,Number(document.getElementById('library-sets')?.value)||item.sets||1)),reps=Math.max(1,Math.min(100,Number(document.getElementById('library-reps')?.value)||item.reps||1));addExerciseToSelected(mkExercise(item.name,item.muscle,sets,reps,item.weight||0,item.rest||60,item.icon||'🏋️',item));break;}
      case'delete-exercise':removeExercise(idx);break;case'buy-freeze':buyFreeze();break;case'calendar-prev':calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()-1,1);renderScreen();break;case'calendar-next':calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,1);renderScreen();break;case'select-calendar-date':selectedCalendarDate=el.dataset.date;renderScreen();break;
      case'save-profile':{const name=document.getElementById('profile-name-input')?.value.trim(),weight=Number(document.getElementById('body-weight-input')?.value);if(name)state.profile.name=name.slice(0,32);if(Number.isFinite(weight)&&weight>=25&&weight<=300)state.profile.bodyWeightKg=weight;const u=document.getElementById('unit-select')?.value;state.settings.unit=u==='lb'?'lb':'kg';saveState();renderScreen();showToast('Đã lưu hồ sơ và cân nặng.','✅');break;}
      case'export-data':exportData();break;case'import-data':importData();break;case'reset-data':resetData();break;case'close-modal':if(el.classList.contains('modal-backdrop')&&event.target!==el)return;document.getElementById('modal-root').innerHTML='';break;
    }};});
    view.querySelectorAll('[data-schedule-day]').forEach(select=>select.onchange=()=>{state.routine.schedule[Number(select.dataset.scheduleDay)]=select.value;saveState();showToast(`${DAY_NAMES[Number(select.dataset.scheduleDay)]} đã cập nhật.`,'📅');});
    view.querySelectorAll('[data-routine-field]').forEach(input=>input.onchange=()=>editRoutineTarget(input));
    view.querySelectorAll('[data-set-input]').forEach(input=>input.oninput=()=>updateSetInput(input));
    view.querySelectorAll('[data-cardio-field]').forEach(input=>{input.oninput=()=>updateCardioField(input);input.onchange=()=>{updateCardioField(input);if(input.tagName==='SELECT')renderScreen();};});
    view.querySelectorAll('[data-cardio-mode]').forEach(input=>input.onchange=()=>updateCardioMode(input));
    view.querySelectorAll('[data-cardio-complete]').forEach(input=>input.onchange=()=>toggleCardioComplete(input));
    const customForm=document.getElementById('custom-exercise-form');if(customForm)customForm.onsubmit=event=>{event.preventDefault();const name=document.getElementById('custom-ex-name').value.trim();if(!name)return;const muscle=document.getElementById('custom-ex-muscle').value.trim()||'Toàn thân';const rest=Math.max(0,Math.min(600,Number(document.getElementById('custom-ex-rest').value)||60)),sets=Math.max(1,Math.min(12,Number(document.getElementById('custom-ex-sets').value)||3)),reps=Math.max(1,Math.min(100,Number(document.getElementById('custom-ex-reps').value)||10)),weight=displayToKg(document.getElementById('custom-ex-weight').value,unit()),type=document.getElementById('custom-ex-type').value;addExerciseToSelected(mkExercise(name,muscle,sets,reps,weight,rest,type==='cardio'?'🏃':'🏋️',{type:type==='cardio'?'cardio':undefined,cardioType:'jump_rope'}));};
  }
  document.getElementById('modal-root').addEventListener('click',event=>{const target=event.target.closest('[data-action="close-modal"]');if(!target)return;if(target.classList.contains('modal-backdrop')&&event.target!==target)return;document.getElementById('modal-root').innerHTML='';});
  timerInterval=setInterval(updateRestTimer,1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateRestTimer();});
  syncHeader();renderScreen();if(state.activeSession?.restTimerEnd)updateRestTimer();
})();

</script>
