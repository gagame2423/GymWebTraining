  function makeLineChart(items,mode){const width=540,height=220,left=43,right=12,top=14,bottom=30,plotW=width-left-right,plotH=height-top-bottom;if(!items.length)return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="No volume history yet"><text x="${width/2}" y="${height/2}" class="chart-label" text-anchor="middle">Complete a workout to start your chart</text></svg>`;const data=items.slice(-10);const max=Math.max(1,...data.map(d=>d.value));const roundedMax=max===0?1:max*1.15;const x=i=>left+(data.length===1?plotW/2:i/(data.length-1)*plotW);const y=v=>top+plotH-(v/roundedMax)*plotH;let grid='';for(let i=0;i<4;i++){const yy=top+i*plotH/3;grid+=`<line class="chart-gridline" x1="${left}" x2="${width-right}" y1="${yy}" y2="${yy}"/><text class="chart-label" x="${left-8}" y="${yy+3}" text-anchor="end">${formatNumber(roundedMax*(1-i/3))}</text>`;}const pts=data.map((d,i)=>`${x(i)},${y(d.value)}`).join(' ');const area=`${x(0)},${top+plotH} ${pts} ${x(data.length-1)},${top+plotH}`;let labels=data.map((d,i)=>data.length<=5||i%Math.ceil(data.length/5)===0||i===data.length-1?`<text class="chart-label" x="${x(i)}" y="${height-8}" text-anchor="middle">${safeText(d.label)}</text>`:'').join('');return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Lifted volume by workout">${grid}<polygon points="${area}" fill="rgba(34,197,94,.10)"/><polyline points="${pts}" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${data.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d.value)}" r="3.5" fill="#0f172a" stroke="#86efac" stroke-width="2"><title>${safeText(d.label)}: ${formatNumber(d.value)} kg</title></circle>`).join('')}${labels}</svg>`;}
  function makeCompoundChart(history){const width=540,height=220,left=43,right=12,top=14,bottom=30,plotW=width-left-right,plotH=height-top-bottom;const specs=[{key:'bench',label:'Bench',match:/bench press/i,color:'#06b6d4'},{key:'deadlift',label:'Deadlift',match:/deadlift/i,color:'#f59e0b'},{key:'squat',label:'Squat',match:/squat/i,color:'#a78bfa'}];const dates=history.slice(-10);const lines=specs.map(spec=>({ ...spec,vals:dates.map(h=>{let best=0;(h.exercises||[]).forEach(ex=>{if(spec.match.test(ex.name||''))(ex.sets||[]).forEach(s=>{best=Math.max(best,Number(s.weightKg)||0);});});return best;})}));const max=Math.max(1,...lines.flatMap(l=>l.vals));const round=max*1.2;const x=i=>left+(dates.length<=1?plotW/2:i/(Math.max(1,dates.length-1))*plotW);const y=v=>top+plotH-(v/round)*plotH;let grid='';for(let i=0;i<4;i++){const yy=top+i*plotH/3;grid+=`<line class="chart-gridline" x1="${left}" x2="${width-right}" y1="${yy}" y2="${yy}"/><text class="chart-label" x="${left-8}" y="${yy+3}" text-anchor="end">${formatNumber(round*(1-i/3),0)}</text>`;}let linesSvg='',pointsSvg='';for(const l of lines){let connected=false,seg=[];l.vals.forEach((v,i)=>{if(v>0){seg.push(`${x(i)},${y(v)}`);connected=true;}else if(connected){if(seg.length>1)linesSvg+=`<polyline points="${seg.join(' ')}" fill="none" stroke="${l.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;seg=[];connected=false;}});if(seg.length>1)linesSvg+=`<polyline points="${seg.join(' ')}" fill="none" stroke="${l.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;l.vals.forEach((v,i)=>{if(v>0)pointsSvg+=`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${l.color}"><title>${l.label}: ${weightText(v,1,'kg')} · ${safeText(dates[i].date)}</title></circle>`;});}let labels=dates.map((d,i)=>dates.length<=5||i%Math.ceil(dates.length/5)===0||i===dates.length-1?`<text class="chart-label" x="${x(i)}" y="${height-8}" text-anchor="middle">${safeText(parseDateKey(d.date).toLocaleDateString(undefined,{month:'short',day:'numeric'}))}</text>`:'').join('');return {svg:`<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Compound lift weight progression">${grid}${linesSvg}${pointsSvg}${labels}${!history.length?`<text x="${width/2}" y="${height/2}" text-anchor="middle" class="chart-label">No lift data yet</text>`:''}</svg>`};}
  function startWorkout(sessionId){

  function refreshWorkoutMetrics(){const active=state.activeSession;if(!active)return;const done=sessionCompletedSets(active),total=sessionTotalSets(active),volume=sumSessionVolume(active),ratings=active.exercises.filter(e=>e.rating).length;const progress=total?done/total*100:0;const fill=document.getElementById('workout-progress-fill');if(fill)fill.style.width=`${progress}%`;const summarySets=document.getElementById('summary-sets');if(summarySets)summarySets.textContent=`${done} / ${total}`;const summaryVol=document.getElementById('summary-volume');if(summaryVol)summaryVol.textContent=`${formatNumber(volume)} kg`;const finish=document.getElementById('finish-workout-btn');if(finish)finish.disabled=!sessionIsReadyToFinish(active);const note=document.getElementById('finish-note');if(note)note.textContent=sessionIsReadyToFinish(active)?'All requirements met. Claim your rewards!':'Finish all sets and add every form rating to unlock rewards.';}

  function formatTimer(totalSeconds){const secs=Math.max(0,Math.ceil(totalSeconds));return `${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;}
  function startRestTimer(seconds,toast=true){if(!state.activeSession)return;state.activeSession.restTimerEnd=Date.now()+Math.max(0,Number(seconds)||0)*1000;state.activeSession.restLabel=seconds;saveState();updateRestTimer();if(toast)showToast(`Rest timer started · ${formatTimer(seconds)}`,'⏱');}

  function playBeep(long=false){try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;const ctx=new Ctx();const osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.type='sine';osc.frequency.value=long?880:620;gain.gain.setValueAtTime(.0001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.12,ctx.currentTime+.02);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+(long?.35:.12));osc.start();osc.stop(ctx.currentTime+(long?.4:.15));osc.onended=()=>ctx.close();}catch(e){/* audio is optional; visual alert remains */}}
  function awardBadge(id){if(!state.profile.badges.includes(id)){state.profile.badges.push(id);const badge=ACHIEVEMENTS.find(a=>a.id===id);showToast(`Achievement unlocked: ${badge?.name||id}!`,'🏅');return true;}return false;}
  function checkAndAwardProgress(prs,now){if(state.history.length<=1)awardBadge('first-workout');if(prs.length)awardBadge('pr-buster');if(now.getHours()<7)awardBadge('early-bird');if(now.getHours()>=22)awardBadge('night-owl');if(state.profile.streak>=7){const newBadge=awardBadge('iron-7');if(newBadge)state.profile.freezes+=1;}if(state.profile.streak>=30){const newBadge=awardBadge('iron-30');if(newBadge)state.profile.freezes+=1;}if(state.profile.allTimeVolume>=10000)awardBadge('volume-10k');if(currentLevel().level>=10)awardBadge('level-10');if(state.profile.freezes>0)awardBadge('freeze-saver');}
  function countMissedScheduledDays(lastDate,todayDate){if(!lastDate||lastDate>=todayDate)return 0;let missed=0;for(let key=offsetDateKey(lastDate,1);key<todayDate;key=offsetDateKey(key,1)){const day=parseDateKey(key).getDay();if((state.routine.schedule[day]||'rest')!=='rest'&&!completedWorkoutOn(key))missed++;}return missed;}
  function finishWorkout(){const session=state.activeSession;if(!session)return;if(!sessionIsReadyToFinish(session)){showToast('Complete each set and rate every exercise first.','🎯');return;}if(completedWorkoutOn(session.date)){showToast('Rewards for this date have already been claimed.','🏆');state.activeSession=null;saveState();navigate('dashboard');return;}
    const now=new Date();let baseVolumeExp=0,mindBonus=0,volume=0,completedSets=0,prs=[];const recordExercises=[];
    const histExercises=session.exercises.map(ex=>{let exBase=0,exVol=0,maxWeight=0;const sets=ex.sets.map(s=>{const reps=Math.max(0,Number(s.reps)||0),weightKg=Math.max(0,Number(s.weightKg)||0);if(s.completed){const v=weightKg*reps;exVol+=v;volume+=v;completedSets++;exBase+=v*.1;maxWeight=Math.max(maxWeight,weightKg);}return {reps,weightKg,completed:!!s.completed};});baseVolumeExp+=exBase;const bonus=exBase*(Number(ex.rating)||0)*.1;mindBonus+=bonus;const key=String(ex.name||'').trim().toLowerCase();const prev=Number(state.profile.personalRecords[key]||0);if(maxWeight>prev){state.profile.personalRecords[key]=maxWeight;if(maxWeight>0)prs.push({name:ex.name,weightKg:maxWeight,previousKg:prev});}recordExercises.push({id:ex.id,name:ex.name,muscle:ex.muscle,sets,rating:ex.rating,volume:exVol});return {id:ex.id,name:ex.name,muscle:ex.muscle,sets,rating:ex.rating,volume:exVol};});
    const rawXp=Math.round(baseVolumeExp+mindBonus)+100;const beforeLevel=currentLevel().level;state.profile.totalXp+=rawXp;state.profile.gems+=25+(prs.length?25:0);state.profile.allTimeVolume+=volume;
    const previousDate=state.profile.lastWorkoutDate;let streak;if(!previousDate){streak=1;}else if(previousDate===session.date){streak=state.profile.streak||1;}else{const missed=countMissedScheduledDays(previousDate,session.date);if(missed===0){streak=(state.profile.streak||0)+1;}else if(state.profile.freezes>=missed){state.profile.freezes-=missed;streak=(state.profile.streak||0)+1;showToast(`${missed} Streak Freeze${missed>1?'s':''} used. Your streak survives!`,'🧊');}else{streak=1;showToast('A missed training day reset your streak. Your next streak starts now.','🔥');}}
    state.profile.streak=streak;state.profile.bestStreak=Math.max(state.profile.bestStreak||0,streak);state.profile.lastWorkoutDate=session.date;
    const durationMinutes=Math.max(1,Math.round((now.getTime()-(session.startedAt||now.getTime()))/60000));const historyEntry={id:session.id,date:session.date,split:session.split,volume:Math.round(volume*10)/10,baseVolumeExp:Math.round(baseVolumeExp),mindBonusExp:Math.round(mindBonus),completionBonus:100,xpEarned:rawXp,completedSets,totalSets:sessionTotalSets(session),durationMinutes,prs:prs.map(p=>p.name),exercises:histExercises,completedAt:now.toISOString(),ratings:session.exercises.map(e=>({name:e.name,rating:e.rating}))};state.history.push(historyEntry);state.history.sort((a,b)=>a.date.localeCompare(b.date));state.activeSession=null;checkAndAwardProgress(prs,now);const afterLevel=currentLevel().level;saveState();confettiBurst();if(afterLevel>beforeLevel){showLevelUp(afterLevel,rawXp,volume,prs);}else{showCompletionModal(rawXp,volume,mindBonus,prs,streak);}navigate('dashboard');
  }
  function showCompletionModal(xp,volume,bonus,prs,streak){const root=document.getElementById('modal-root');root.innerHTML=`<div class="modal-backdrop" data-action="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="complete-title"><div class="modal-icon">🏆</div><div class="eyebrow">QUEST COMPLETE</div><h2 id="complete-title">You did that.</h2><p>Session saved. Progress earned. Take a breath and enjoy the win.</p><div class="reward-card"><div class="reward-chip">⚡ +${formatNumber(xp)} EXP</div><div class="reward-chip">💎 +${prs.length?50:25} gems</div><div class="reward-chip">🔥 ${streak}-day streak</div></div><p style="font-size:11px">${formatNumber(volume)} kg volume · +${formatNumber(Math.round(bonus))} mind-muscle bonus EXP${prs.length?` · New PR: ${safeText(prs.map(p=>p.name).join(', '))}`:''}</p><button class="btn btn-primary btn-full" data-action="close-modal">Keep going →</button></div></div>`;}
  function showLevelUp(level,xp,volume,prs){const root=document.getElementById('modal-root');root.innerHTML=`<div class="modal-backdrop" data-action="close-modal"><div class="modal levelup-modal" role="dialog" aria-modal="true" aria-labelledby="levelup-title"><div class="modal-icon">👑</div><div class="eyebrow" style="color:var(--gold)">LEVEL UP!</div><h2 id="levelup-title">Level ${level} unlocked</h2><p>You’re now a <strong style="color:var(--gold)">${safeText(levelTitle(level))}</strong>. Every rep brought you here. Keep building.</p><div class="reward-card"><div class="reward-chip">⚡ +${formatNumber(xp)} EXP</div><div class="reward-chip">💎 Gems earned</div><div class="reward-chip">📈 ${formatNumber(volume)} kg volume</div></div><button class="btn btn-primary btn-full" data-action="close-modal">Claim level →</button></div></div>`;}
  function confettiBurst(){const colors=['#22c55e','#06b6d4','#f59e0b','#a78bfa','#fb7185'];for(let i=0;i<42;i++){const el=document.createElement('i');el.className='confetti';el.style.left=(Math.random()*100)+'vw';el.style.background=colors[i%colors.length];el.style.animationDelay=(Math.random()*.55)+'s';el.style.transform=`rotate(${Math.random()*180}deg)`;el.style.width=(5+Math.random()*6)+'px';el.style.height=(8+Math.random()*8)+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),3300);}}
  function applyPreset(kind){if(kind==='ppl')state.routine.schedule={0:'rest',1:'push',2:'pull',3:'legs',4:'push',5:'pull',6:'legs'};else if(kind==='upperlower')state.routine.schedule={0:'rest',1:'upper',2:'lower',3:'rest',4:'upper',5:'lower',6:'rest'};else if(kind==='fullbody')state.routine.schedule={0:'rest',1:'full_body',2:'rest',3:'full_body',4:'rest',5:'full_body',6:'rest'};saveState();renderScreen();showToast('Weekly schedule updated.','📅');}
  function addCustomSession(){const name=prompt('Name your new split (e.g. Arms & Shoulders):');if(!name||!name.trim())return;const clean=name.trim().slice(0,40);const id=clean.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')+'_'+Date.now().toString(36).slice(-4);state.routine.sessions[id]={id,name:clean,icon:'🏋️',exercises:[]};selectedRoutineSession=id;saveState();renderScreen();showToast(`${clean} split created. Add your exercises below.`,'✨');}
  function addExerciseToSelected(exercise){const session=state.routine.sessions[selectedRoutineSession];if(!session||session.id==='rest')return;session.exercises.push(exercise);saveState();renderScreen();showToast(`${exercise.name} added to ${session.name}.`,'➕');}
  function removeExercise(index){const session=state.routine.sessions[selectedRoutineSession];if(!session)return;const ex=session.exercises[index];if(!ex)return;if(!confirm(`Remove ${ex.name} from ${session.name}?`))return;session.exercises.splice(index,1);saveState();renderScreen();showToast('Exercise removed.','🗑️');}
  function editRoutineTarget(input){const session=state.routine.sessions[selectedRoutineSession];const ex=session?.exercises?.[Number(input.dataset.exIndex)];if(!ex)return;const field=input.dataset.routineField;const value=Number(input.value);if(!Number.isFinite(value)||value<0){showToast('Enter a valid target.','⚠️');return;}if(field==='sets')ex.sets=Math.max(1,Math.min(12,Math.round(value)));if(field==='reps')ex.reps=Math.max(1,Math.min(100,Math.round(value)));if(field==='weight')ex.targetWeight=displayToKg(value,unit());saveState();showToast(`${ex.name} target updated.`,'✓');}
  function buyFreeze(){if(state.profile.gems<150){showToast('You need 150 gems to buy a freeze.','💎');return;}state.profile.gems-=150;state.profile.freezes++;awardBadge('freeze-saver');saveState();renderScreen();showToast('Streak Freeze added to your inventory.','🧊');}
  function resetData(){if(!confirm('Reset all RepQuest data on this browser? This deletes your workout history, XP, and routine. Export your save first if you want a backup.'))return;state=DEFAULT_STATE();selectedRoutineSession='push';currentScreen='dashboard';saveState();renderScreen();showToast('Local save reset to a fresh profile.','↻');}
  function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`repquest-save-${localDateKey(new Date())}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);showToast('Save exported as JSON.','⬇️');}
  function importData(){const input=document.createElement('input');input.type='file';input.accept='application/json,.json';input.onchange=()=>{const file=input.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(String(reader.result));if(!parsed||!parsed.profile||!parsed.routine||!Array.isArray(parsed.history))throw new Error('This file does not look like a RepQuest save.');if(!confirm('Import this save and replace the current local data?'))return;localStorage.setItem(STORAGE_KEY,JSON.stringify(parsed));state=loadState();selectedRoutineSession=Object.keys(state.routine.sessions).find(id=>id!=='rest')||'push';saveState();renderScreen();showToast('Save imported successfully.','✅');}catch(e){alert(`Could not import save: ${e.message}`);}};reader.readAsText(file);};input.click();}
  function bindScreenEvents(){
    document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>navigate(b.dataset.screen));
    const view=document.getElementById('view');if(!view)return;
    view.querySelectorAll('[data-action]').forEach(el=>{el.onclick=(event)=>{const a=el.dataset.action;const idx=Number(el.dataset.exIndex),setIdx=Number(el.dataset.setIndex);switch(a){
      case'go-routine':navigate('routine');break;case'go-profile':navigate('profile');break;case'go-workout':navigate('workout');break;
      case'start-workout':startWorkout();break;case'resume-workout':navigate('workout');break;case'review-today':navigate('profile');showToast('Your completed session is in the training history.','🏆');break;
      case'start-optional':{const sid=document.getElementById('optional-session')?.value;startWorkout(sid);break;}
      case'start-selected':{const sid=document.getElementById('workout-session-select')?.value;startWorkout(sid);break;}
      case'choose-other':{const all=Object.values(state.routine.sessions).filter(s=>s.id!=='rest');const chosen=prompt('Enter a session name to start:\n'+all.map(s=>s.name).join(', '),all[0]?.name||'Push');if(chosen){const match=all.find(s=>s.name.toLowerCase()===chosen.trim().toLowerCase());if(match)startWorkout(match.id);else showToast('Could not find that split. Use Routine Builder to configure it.','⚠️');}break;}
      case'finish-workout':finishWorkout();break;case'toggle-set':toggleSet(idx,setIdx,!state.activeSession?.exercises?.[idx]?.sets?.[setIdx]?.completed);break;
      case'rating':setRating(idx,Number(el.dataset.rating));break;case'cancel-workout':if(confirm('End this session without rewards? Your progress is saved so you can resume later.')){state.activeSession=null;saveState();navigate('dashboard');showToast('Session ended. No rewards were claimed.','ℹ️');}break;
      case'start-rest-manual':startRestTimer(Number(el.dataset.seconds)||60);break;case'skip-rest':stopRestTimer();showToast('Rest timer skipped.','⏱');break;
      case'save-routine':saveState();showToast('Routine saved to this browser.','✅');break;case'apply-preset':applyPreset(document.getElementById('preset-select')?.value||'ppl');break;case'add-session':addCustomSession();break;case'reset-routine':if(confirm('Restore the default Push / Pull / Legs schedule and exercise presets? Your workout history and XP will stay untouched.')){state.routine={sessions:defaultSessions(),schedule:{0:'rest',1:'push',2:'pull',3:'legs',4:'push',5:'pull',6:'legs'}};selectedRoutineSession='push';saveState();renderScreen();showToast('Default PPL routine restored.','↻');}break;
      case'select-session':selectedRoutineSession=el.dataset.sessionId;renderScreen();break;case'add-library-exercise':{const preset=BUILTIN_EXERCISES[Number(document.getElementById('library-select')?.value)];if(!preset)return;const sets=Math.max(1,Math.min(12,Number(document.getElementById('library-sets')?.value)||preset.sets));const reps=Math.max(1,Math.min(100,Number(document.getElementById('library-reps')?.value)||preset.reps));addExerciseToSelected(mkExercise(preset.name,preset.muscle,sets,reps,preset.weight,preset.rest,preset.icon));break;}
      case'delete-exercise':removeExercise(idx);break;case'buy-freeze':buyFreeze();break;case'calendar-prev':calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()-1,1);renderScreen();break;case'calendar-next':calendarMonth=new Date(calendarMonth.getFullYear(),calendarMonth.getMonth()+1,1);renderScreen();break;case'select-calendar-date':selectedCalendarDate=el.dataset.date;renderScreen();break;
      case'save-name':{const input=document.getElementById('profile-name-input');const val=input?.value.trim();if(val){state.profile.name=val.slice(0,32);saveState();renderScreen();showToast('Profile name updated.','✅');}else showToast('Enter a name first.','⚠️');break;}
      case'export-data':exportData();break;case'import-data':importData();break;case'reset-data':resetData();break;case'close-modal':if(el.classList.contains('modal-backdrop')&&event.target!==el)return;document.getElementById('modal-root').innerHTML='';break;
    }};});
    view.querySelectorAll('[data-schedule-day]').forEach(select=>select.onchange=()=>{state.routine.schedule[Number(select.dataset.scheduleDay)]=select.value;saveState();showToast(`${DAY_NAMES[Number(select.dataset.scheduleDay)]} updated.`,`📅`);});
    view.querySelectorAll('[data-routine-field]').forEach(input=>input.onchange=()=>editRoutineTarget(input));
    view.querySelectorAll('[data-set-input]').forEach(input=>input.oninput=()=>updateSetInput(input));
    const customForm=document.getElementById('custom-exercise-form');if(customForm)customForm.onsubmit=(e)=>{e.preventDefault();const name=document.getElementById('custom-ex-name').value.trim();if(!name)return;const muscle=document.getElementById('custom-ex-muscle').value.trim()||'General';const rest=Math.max(0,Math.min(600,Number(document.getElementById('custom-ex-rest').value)||60));const sets=Math.max(1,Math.min(12,Number(document.getElementById('custom-ex-sets').value)||3));const reps=Math.max(1,Math.min(100,Number(document.getElementById('custom-ex-reps').value)||10));const w=displayToKg(document.getElementById('custom-ex-weight').value,unit());addExerciseToSelected(mkExercise(name,muscle,sets,reps,w,rest,'🏋️'));};
    const unitSelect=document.getElementById('unit-select');if(unitSelect)unitSelect.onchange=()=>{state.settings.unit=unitSelect.value==='lb'?'lb':'kg';saveState();renderScreen();showToast(`Weight display changed to ${unit()}.`,'⚖️');};
  }
  // One small interval services the active rest timer; the workout clock never depends on button clicks.
  timerInterval=setInterval(updateRestTimer,1000);
  document.getElementById('modal-root').addEventListener('click',event=>{const target=event.target.closest('[data-action="close-modal"]');if(!target)return;if(target.classList.contains('modal-backdrop')&&event.target!==target)return;document.getElementById('modal-root').innerHTML='';});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateRestTimer();});
  // Keep the layout resilient if a save was started on another split or another day.
  syncHeader();renderScreen();if(state.activeSession&&state.activeSession.restTimerEnd)updateRestTimer();
})();
</script>
